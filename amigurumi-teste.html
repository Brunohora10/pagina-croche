<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Amigurumis — Teste de Layout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #faf7f4;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 18px;
      color: #1a1a1a;
      line-height: 1.7;
    }

    /* ══ CABEÇALHO ══ */
    header {
      background: #5e2d7a;
      color: #fff;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header .back {
      font-size: 26px;
      text-decoration: none;
      color: #fff;
      line-height: 1;
    }
    header h1 { font-size: 20px; font-weight: 700; line-height: 1.2; }
    header p  { font-size: 14px; opacity: .75; }

    /* ══ GRADE ══ */
    .page { max-width: 860px; margin: 0 auto; padding: 24px 14px 60px; }
    .page-titulo { font-size: 19px; font-weight: 700; color: #2a1a2a; margin-bottom: 18px; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 3px 14px rgba(0,0,0,.1);
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .card:active { transform: scale(.97); }
    @media (hover: hover) {
      .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,.15); }
    }

    /* Thumb — usa a primeira página do PDF como capa */
    .card-thumb {
      width: 100%; height: 180px;
      background: #1a0a2a;
      overflow: hidden;
      position: relative;
    }
    .card-thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }
    .card-thumb .badge {
      position: absolute; bottom: 8px; right: 8px;
      background: rgba(94,45,122,.85);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .card-body { padding: 16px; }
    .card-nome  { font-size: 17px; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
    .card-meta  { font-size: 14px; color: #666; margin-bottom: 14px; }
    .card-btn {
      width: 100%;
      background: #5e2d7a;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    .card-btn:active { background: #4a2062; }

    /* ══ OVERLAY ══ */
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.7);
      z-index: 300;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .overlay.open { display: block; }

    /* ══ MODAL ══ */
    .modal {
      background: #fff;
      max-width: 700px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }
    @media (min-width: 720px) {
      .modal { margin: 28px auto 60px; border-radius: 18px; overflow: hidden; min-height: auto; }
    }

    /* ══ FECHAR ══ */
    .fechar {
      position: fixed;
      top: 12px; right: 12px;
      z-index: 400;
      width: 48px; height: 48px;
      border-radius: 50%;
      background: rgba(0,0,0,.6);
      color: #fff;
      border: none;
      font-size: 24px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    /* ══ FOTO TOPO ══ */
    .modal-foto {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    /* ══ CORPO ══ */
    .modal-body { padding: 24px 18px 60px; }

    .r-titulo {
      font-size: 26px;
      font-weight: 800;
      color: #1a0a1a;
      line-height: 1.2;
      margin-bottom: 18px;
    }

    /* Seção */
    .secao {
      font-size: 16px;
      font-weight: 800;
      color: #5e2d7a;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin: 28px 0 14px;
      padding-bottom: 8px;
      border-bottom: 2px solid #d8c0ec;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Materiais */
    .mat-lista { list-style: none; }
    .mat-lista li {
      font-size: 18px;
      padding: 10px 0 10px 34px;
      border-bottom: 1px solid #ece4e4;
      position: relative;
      line-height: 1.5;
    }
    .mat-lista li::before {
      content: '🧶';
      position: absolute; left: 0; top: 10px;
      font-size: 16px;
    }

    /* Apostila — páginas do PDF em tela cheia */
    .apostila { margin: 0 -18px; }
    .pag-label {
      font-size: 14px;
      color: #999;
      text-align: center;
      padding: 12px 0 4px;
      background: #f0eaf5;
    }
    .pag-img {
      width: 100%;
      display: block;
    }

    /* Botão baixar */
    .btn-baixar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: #d45c28;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 20px;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      margin-top: 32px;
    }
    .btn-baixar:active { background: #b84d20; }
  </style>
</head>
<body>

<header>
  <a class="back" href="index.html">←</a>
  <div>
    <h1>Amigurumis</h1>
    <p>Clique em uma receita para ver</p>
  </div>
</header>

<div class="page">
  <div class="page-titulo">Escolha uma receita:</div>
  <div class="cards" id="grade"></div>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay">
  <button class="fechar" id="btn-fechar">✕</button>
  <div class="modal" id="modal">
    <img class="modal-foto" id="modal-foto" src="" alt=""/>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
/* ═══════════════════
   DADOS DAS RECEITAS
═══════════════════ */
const RECEITAS = [
  {
    slug: 'leao',
    nome: 'Amigurumi Leão',
    meta: '3 páginas · Amigurumi',
    capa: 'receitas/imgs/amigurumis/leao-p1.png',
    materiais: [
      'Linha Amigurumi cor 7650 (Amêndoa)',
      'Linha Amigurumi cor 8990 (Preto)',
      'Linha Amigurumi cor 7569 (Tabaco)',
      'Agulha de crochê 3 mm',
      'Agulha de tapeçaria nº 16',
      'Olhos de segurança 10 mm',
      'Fibra para enchimento',
    ],
    paginas: [
      'receitas/imgs/amigurumis/leao-p1.png',
      'receitas/imgs/amigurumis/leao-p2.png',
      'receitas/imgs/amigurumis/leao-p3.png',
    ],
    pdf: 'receitas/pdfs/amig-leao.pdf',
  },
  {
    slug: 'gatinhos',
    nome: '3 Gatinhos',
    meta: '8 páginas · Amigurumi',
    capa: 'receitas/imgs/amigurumis/gatinhos-p1.png',
    materiais: [
      'Linha de amigurumi nas cores desejadas',
      'Agulha de crochê 2,5 mm ou 3 mm',
      'Olhos de segurança',
      'Fibra para enchimento',
      'Agulha de tapeçaria',
    ],
    paginas: [
      'receitas/imgs/amigurumis/gatinhos-p1.png',
      'receitas/imgs/amigurumis/gatinhos-p2.png',
      'receitas/imgs/amigurumis/gatinhos-p3.png',
      'receitas/imgs/amigurumis/gatinhos-p4.png',
      'receitas/imgs/amigurumis/gatinhos-p5.png',
      'receitas/imgs/amigurumis/gatinhos-p6.png',
      'receitas/imgs/amigurumis/gatinhos-p7.png',
      'receitas/imgs/amigurumis/gatinhos-p8.png',
    ],
    pdf: 'receitas/pdfs/amig-gatinhos.pdf',
  },
  {
    slug: 'ursinho',
    nome: 'Mini Ursinho',
    meta: '3 páginas · Amigurumi',
    capa: 'receitas/imgs/amigurumis/ursinho-p1.png',
    materiais: [
      'Linha Amigurumi nas cores desejadas',
      'Agulha de crochê 3 mm',
      'Olhos de segurança 8 mm',
      'Fibra para enchimento',
      'Agulha de tapeçaria',
    ],
    paginas: [
      'receitas/imgs/amigurumis/ursinho-p1.png',
      'receitas/imgs/amigurumis/ursinho-p2.png',
      'receitas/imgs/amigurumis/ursinho-p3.png',
    ],
    pdf: 'receitas/pdfs/amig-ursinho.pdf',
  },
];

/* ═══════════
   GERA CARDS
═══════════ */
const grade = document.getElementById('grade');
RECEITAS.forEach(r => {
  grade.innerHTML += `
    <div class="card" onclick="abrirReceita('${r.slug}')">
      <div class="card-thumb">
        <img src="${r.capa}" alt="${r.nome}" loading="lazy"/>
        <div class="badge">📄 PDF</div>
      </div>
      <div class="card-body">
        <div class="card-nome">${r.nome}</div>
        <div class="card-meta">${r.meta}</div>
        <button class="card-btn">Ver receita</button>
      </div>
    </div>`;
});

/* ═══════════════
   ABRIR MODAL
═══════════════ */
function abrirReceita(slug) {
  const r = RECEITAS.find(x => x.slug === slug);
  if (!r) return;

  // Foto topo
  document.getElementById('modal-foto').src = r.capa;
  document.getElementById('modal-foto').alt = r.nome;

  // Materiais
  const mats = r.materiais.map(m => `<li>${m}</li>`).join('');

  // Páginas do PDF
  const pags = r.paginas.map((src, i) => `
    <div class="pag-label">— Página ${i + 1} de ${r.paginas.length} —</div>
    <img class="pag-img" src="${src}" alt="Página ${i+1}" loading="lazy"/>
  `).join('');

  document.getElementById('modal-body').innerHTML = `
    <div class="r-titulo">${r.nome}</div>

    <div class="secao">🧶 Materiais</div>
    <ul class="mat-lista">${mats}</ul>

    <div class="secao">📄 Receita completa</div>
    <p style="font-size:16px;color:#666;margin-bottom:4px">Role para baixo para ver todas as páginas:</p>
    <div class="apostila">${pags}</div>

    <a class="btn-baixar" href="${r.pdf}" download>
      ⬇ Baixar apostila em PDF
    </a>
  `;

  const ov = document.getElementById('overlay');
  ov.classList.add('open');
  ov.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}

/* ═══════════
   FECHAR
═══════════ */
function fecharModal() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('modal-foto').src = '';
  document.getElementById('modal-body').innerHTML = '';
  document.body.style.overflow = '';
}

document.getElementById('btn-fechar').addEventListener('click', fecharModal);
document.getElementById('overlay').addEventListener('click', function(e) {
  if (e.target === this) fecharModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });
</script>

</body>
</html>
